name: Build debug APK

# Builds a debug APK on every push to main and on manual dispatch.
# The project requires JDK 21 (Kotlin jvmTarget 21 / jvmToolchain 21).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVaultNext-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
