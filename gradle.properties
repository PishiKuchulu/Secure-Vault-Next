# =====================================================================
# Project-wide Gradle settings.
# =====================================================================

# Give the daemon enough heap for a multi-module Compose build without
# thrashing; G1GC keeps pause times predictable on CI runners.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dhttps.protocols=TLSv1.2,TLSv1.3

# Run independent modules in parallel and cache task outputs — with
# 12+ modules this materially shortens CI build time.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is mandatory; this is not a legacy support-library project.
android.useAndroidX=true

# Kotlin code style used by IDE formatters (matches ktlint's default).
kotlin.code.style=official

# Disable build feature flags we are not using, to keep module builds
# lean (BuildConfig is still needed for BUILD_TYPE-based behavior).
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false
